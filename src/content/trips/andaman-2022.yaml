summary: >-
  Two weeks in the Andamans built around a 7-day scuba course in Havelock, then fun dives in Neil
  and a few days of history and islands around Port Blair. Slow, salty and the trip that
  started the diving obsession.
highlights:
  - Seven days of scuba training in Havelock
  - Sunsets at Radhanagar (Beach No. 7) and Kalapathar
  - Fun dives and natural bridge at Neil
  - North Bay, Ross Island and the Cellular Jail light show
bestTime: November–April (calm seas, best visibility)
