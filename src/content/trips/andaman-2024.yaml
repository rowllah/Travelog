summary: >-
  A tighter, dive-focused return to the Andamans: three days of diving off Havelock, night
  kayaking through bioluminescence, then Neil for more dives before a sunset at Chidiya Tapu.
highlights:
  - Six dive days across Havelock and Neil
  - Night kayaking and stargazing at Kalapathar
  - Bharatpur beach at sunrise
  - Chidiya Tapu sunset and the Port Blair museum
