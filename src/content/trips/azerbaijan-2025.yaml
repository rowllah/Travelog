summary: >-
  Nine days split between Baku's futuristic skyline and old walled city, the mud volcanoes and
  rock art of Gobustan, snow at Shahdag and the forests and lakes of Gabala. Easy e-visa,
  short flights via Sharjah and great food.
highlights:
  - Heydar Aliyev Center and the Flame Towers lit up at night
  - Gobustan rock art, bubbling mud volcanoes and the eternal fire at Yanar Dag
  - Cable car, snow and the mountain coaster at Shahdag
  - Nohur Lake and the Tufandag cable car in Gabala
  - A proper hamam on the last day
bestTime: April–June and September–October (Shahdag has snow into April)
