tips:
  - Download the Bolt or Yandex Go taxi apps — far cheaper than street taxis.
  - Get offline Google Maps and Google Translate (Azerbaijani) before landing.
  - Carry some USD/EUR cash; card acceptance is good in Baku but patchy in the mountains.
  - Shahdag is cold even in April — pack a proper jacket and gloves.
  - The VisitBaku app is handy for events and opening hours.
checklist: [e-Visa printout, Travel insurance, Universal adapter, Warm jacket, Offline maps]
