tips:
  - Apply for the e-visa at visa2egypt.gov.eg well in advance.
  - Get dive-specific insurance (e.g. DiveAssure) for a liveaboard; normal travel cover usually excludes it.
  - Do Giza at opening time; by 11 am in June it's brutal.
  - Book the Luxor balloon and the GEM online early.
  - Long road transfers (Cairo–Port Ghalib, Hurghada–Luxor) are cheaper than flights and fine with a private cab.
checklist: [e-Visa, Dive insurance, Dive logbook & certification card, Reef-safe sunscreen, Sea-sickness tablets]
