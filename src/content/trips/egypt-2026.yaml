summary: >-
  Two and a half weeks combining a week-long Red Sea liveaboard (Brothers, Daedalus and
  Elphinstone — sharks!) with a classic Nile run: hot air balloon in Luxor, a felucca in Aswan,
  Abu Simbel, and the Pyramids plus the Grand Egyptian Museum to finish.
highlights:
  - Oceanic white-tips and hammerheads at Brothers, Daedalus and Elphinstone
  - Aida and Numidia shipwrecks
  - Dawn hot air balloon over the Valley of the Kings
  - Felucca sunset on the Nile and a Nubian village
  - Giza at opening time, then the Grand Egyptian Museum
bestTime: October–April for sightseeing. June works for diving but Luxor and Aswan go past 40 °C.
