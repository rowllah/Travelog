summary: >-
  A classic 8-night family loop through the Kashmir valley: two nights each in Pahalgam,
  Gulmarg and Sonamarg, ending on a houseboat in Srinagar. We had a private Innova and a
  family-run local operator, while friends did the Aru–Lidderwat trek in parallel.
highlights:
  - Lidder valley walks around Pahalgam
  - Gulmarg gondola up to the snow
  - Day trip to Thajiwas Glacier from Sonamarg
  - Shikara ride and a night on a Dal Lake houseboat
  - Mughal gardens in Srinagar
bestTime: April–June for green meadows; December–February for snow at Gulmarg
