tips:
  - A private vehicle with a local operator lets you change plans around the weather.
  - Two nights per town is the right pace with family.
  - For treks like Tarsar–Marsar or Aru–Lidderwat, go late May to September.
  - Carry layers. Gulmarg can be snowy in May while Srinagar is warm.
