summary: >-
  India's quietest coral islands. Stay at a small beach resort on Agatti, dive with the local
  dive shop, snorkel a shipwreck off Bangaram and kayak in a lagoon you'll have almost to
  yourself. Permits take some planning, but the islands are worth it.
highlights:
  - Shipwreck snorkelling on the Bangaram day trip
  - Diving with Ammathi Scuba
  - Free kayaking in the lagoon
  - Bioluminescence on the beach at night
bestTime: October–May
