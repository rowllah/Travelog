tips:
  - Get a Police Verification Certificate first (Karnataka residents can apply on Seva Sindhu for about ₹450).
  - The administrator entry permit is arranged through a local agent or your resort, for about ₹1,000.
  - The ship from Kochi (about ₹1k) is far cheaper than flying (about ₹6k one way) but runs on an irregular schedule.
  - Alcohol isn't available on Agatti.
