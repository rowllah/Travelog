tips:
  - Local islands are dry — no alcohol, except on the floating bars and at resort visits.
  - Wear modest clothes away from the designated bikini beach.
  - Book a resort day pass if you want the resort experience without the resort price.
  - Excursions are priced in USD. Pay cash for a better rate.
