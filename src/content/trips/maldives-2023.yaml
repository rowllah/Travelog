summary: >-
  The Maldives without the resort price. We stayed on Maafushi, a local island, and spent the
  days on excursions: snorkelling with sharks and turtles, stingrays at Fulidhoo, sandbanks,
  a resort day visit and a first Discover Scuba dive. All for about ₹78k per person.
highlights:
  - Swimming with nurse sharks
  - Stingrays at Fulidhoo
  - Sandbank picnics and dolphins
  - Discover Scuba Diving
  - Sunset fishing & BBQ
bestTime: November–April (dry season). June is cheaper but has more rain.
