coverCredit: Living root bridge, Nongriat — Wikimedia Commons
summary: >-
  Six easy days in the abode of clouds, booked as one package with ChaloHoppo. Three nights at
  a waterfall-deck suite in Sohra, then two at a lake-view resort on Umiam. Expect caves,
  living root bridges, sacred groves and the Laitlum canyons.
highlights:
  - Seven Sisters and Nohkalikai falls
  - Umkar and Ummnonoi living root bridges
  - Mawphlang Sacred Grove with a Khasi guide
  - Laitlum Canyons
  - Zip-lining at Mawkdok
bestTime: October–April is clearest. September is lush, but expect daily rain.
