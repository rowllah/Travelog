summary: >-
  A week of limestone cliffs and turquoise water. Ao Nang and Railay first, then the Emerald
  Pool and hot springs inland, three nights on Phi Phi for diving and an island tour, and a
  last night back in Krabi.
highlights:
  - Railay beach and the viewpoint
  - Emerald Pool & hot springs
  - Diving off Phi Phi
  - Phi Phi island-hopping tour
  - Sunset from Khao Thong Hill café
