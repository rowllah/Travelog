tips:
  - Fill in the TDAC (Thailand Digital Arrival Card) online before you fly.
  - Grab and Bolt work in Krabi. On Phi Phi you walk everywhere.
  - Download offline maps for Krabi and Phi Phi.
  - Pack medicines and printouts, and save travel docs offline in Drive.
  - A forex card with zero markup (e.g. Scapia) saves a lot.
