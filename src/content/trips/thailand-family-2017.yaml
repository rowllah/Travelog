tips:
  - Thai immigration may ask for proof of funds — about USD 700 or THB 20,000 per person in cash.
  - Hotels take a deposit of around USD 100 per room at check-in.
  - Early check-in isn't guaranteed; ask for luggage storage.
  - For domestic flights at Suvarnabhumi, the ground handler meets you at the ATTA counter, exit gates 2–3.
