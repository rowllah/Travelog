summary: >-
  A conference in Istanbul with a week of travel wrapped around it. A dive on the Aegean at
  Kuşadası, Ephesus and Şirince, overnight buses to and from a cave hotel in Cappadocia for the
  balloons, and then Istanbul's Hagia Sophia, Galata, the Grand Bazaar and a 16th-century hamam.
highlights:
  - Hot air balloon at sunrise over Cappadocia
  - Ephesus ruins and the wine village of Şirince
  - Green Tour — Derinkuyu underground city, Ihlara valley
  - Aegean dive off Kuşadası
  - Kılıç Ali Paşa Hamamı in Istanbul
bestTime: April–May and September–October
