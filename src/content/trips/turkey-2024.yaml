tips:
  - "Indian passports need a sticker visa: book a VFS appointment and bring bank statements (6 months), salary slips, ITR, a leave NOC and an undertaking letter."
  - Download BiTaksi for Istanbul and Entaksi for Izmir, plus Flixbus.
  - Overnight buses between Kuşadası, Cappadocia and Istanbul save money and a night's hotel.
  - Balloon flights get cancelled for wind, so keep a backup morning in Cappadocia if you can.
checklist: [Visa, Bank statement & ITR copies, Travel insurance, BiTaksi app, Flixbus app, Offline maps]
