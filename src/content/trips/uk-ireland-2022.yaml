summary: >-
  Nearly three weeks around a course in Cambridge. London, a quick hop to Dublin for the Cliffs
  of Moher and the Giant's Causeway, a 3-day Highlands and Skye tour from Edinburgh, and a
  3-day South West loop through Stonehenge, the Jurassic Coast, Dartmoor and Bath.
highlights:
  - Cliffs of Moher and Galway in one day from Dublin
  - Giant's Causeway in Northern Ireland
  - Punting in Cambridge
  - Eilean Donan Castle, the Quiraing and Loch Ness
  - Stonehenge, Durdle Door and Bath
bestTime: May–September; late September still works with fewer crowds
