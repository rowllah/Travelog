tips:
  - Ireland needs a separate visa (unless you have the BIVS-endorsed UK visa) — plan ahead.
  - Rabbies small-group tours are an easy way to see the Highlands without driving on the left.
  - Get a contactless card for London transport; it's capped daily like an Oyster.
  - Pack layers and a rain jacket, even in September.
