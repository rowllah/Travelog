summary: >-
  Ten days top to bottom with friends: Hanoi's old quarter and train street, a Ha Long Bay
  cruise and the karsts of Ninh Binh, then Da Nang with the Golden Bridge and lantern-lit Hoi
  An, and finally Saigon, the Mekong Delta and the Cu Chi tunnels.
highlights:
  - Ha Long Bay cruise with kayaking into Luon Cave
  - Boat ride through Trang An, Ninh Binh
  - Golden Bridge at Ba Na Hills
  - Hoi An old town and the flower lantern release
  - Mekong Delta and the Cu Chi tunnels
bestTime: October–April. In October the north is cool (20–27 °C), the centre wet, the south warm.
