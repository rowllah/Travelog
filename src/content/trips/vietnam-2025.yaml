tips:
  - An e-visa is mandatory (USD 25 single entry, 3–7 days to process). Apply 2–3 weeks ahead with a 4×6 cm white-background photo.
  - Carry USD and change into VND locally. ₹1 is roughly 300 VND.
  - No shorts in temples. Pack a light rain jacket for central Vietnam in October.
  - Grab is the easiest way to get around every city.
  - Turn on international transactions on your cards and set up an international SIM before you fly.
